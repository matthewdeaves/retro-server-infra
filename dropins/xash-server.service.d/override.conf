[Service]
# Turn on the multiplayer log at every start. Without it xash journals nothing
# when a player joins or leaves -- a real 2026-09-22 join left only "Ignoring
# custom decal" behind -- so a join cannot be confirmed from the server side
# (#27). The game DLL already has mp_logecho 1, so once `log on` runs, every
# connect / "entered the game" / disconnect line is echoed to the console and
# from there into the journal. It also writes valve/logs/L*.log, a few hundred
# bytes per session.
#
# Delivered through the console FIFO, the same way retro and the web admin
# send commands. Opening a FIFO for writing blocks until something has it open
# for reading, and the shipped unit's `exec 3<>` is exactly that, so this cannot
# fire before the server is listening and cannot be lost. The trailing newline
# is required (see engine-facts.md). The timeout only bounds a server that
# never starts.
ExecStartPost=/usr/bin/timeout 30 /bin/sh -c 'printf "log on\n" > /run/half-life-server/console'
