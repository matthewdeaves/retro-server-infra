[Service]
# NetQuake advertises this machine's address to clients, and Ubuntu maps the
# hostname to 127.0.1.1 -- so QS_IP must be set to a real reachable address or
# the server starts but nobody can actually connect. The shipped unit refuses
# to start with it unset, loopback, or a documentation address, but a stale
# syntactically-valid one still passes and silently advertises the wrong
# place. `retro dropins` fills this in from RETRO_SERVER_IP in .env; if the
# instance ever gets a new IP, update .env and re-run `retro dropins`.
Environment=QS_IP=@@RETRO_SERVER_IP@@

# The whole override, as of server-v1.17 -- that release fixed the console
# FIFO (old-mac-quakespasm#11) so the unit no longer needs a pty wrapper or a
# private copy of ExecStart here. `exec 3<>` in the shipped unit is
# load-bearing: it makes the server its own FIFO writer so read() never sees
# EOF between commands, which is also why a console write must end in a
# newline.
